<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f1e7" />
    <meta name="description" content="A tactile bonsai pruning, shaping and exhibition game. Every cut changes its character." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Bonsai" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Bonsai: The Studio</title>
  </head>
  <body>
    <!-- Painted instantly, before any JavaScript loads; removed once the app boots. -->
    <div id="splash" style="position:fixed;inset:0;display:grid;place-items:center;background:#f6f1e7;z-index:100">
      <div style="text-align:center;font-family:Georgia,serif;color:#4a433b">
        <img src="/icon.svg" width="88" height="88" alt="" style="border-radius:22px;box-shadow:0 8px 30px rgba(36,32,28,.12)" />
        <div style="margin-top:14px;font-size:20px;letter-spacing:.02em">Bonsai</div>
        <div style="margin-top:4px;font:500 11px/1 -apple-system,system-ui,sans-serif;letter-spacing:.18em;color:#6e6558">THE STUDIO</div>
        <div style="margin:14px auto 0;width:26px;height:26px;border-radius:4px;background:#c2412a;color:#fbf3e6;font:700 10px/12px 'Hiragino Mincho ProN','Yu Mincho',serif;display:grid;place-items:center;padding-top:1px">盆<br />栽</div>
      </div>
    </div>
    <div id="root"></div>
    <noscript>Bonsai: The Studio needs JavaScript to grow.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
